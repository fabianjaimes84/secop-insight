<app-card>
  <!-- Encabezado -->
  <div>
    <h2 class="text-lg font-semibold text-slate-800">Filtros de búsqueda</h2>
    <p class="mt-1 text-xs text-slate-500">
      Encuentra procesos utilizando uno o varios criterios.
    </p>
  </div>

  <hr class="my-2 border-slate-200" />

  <!-- Formulario -->
  <div [formGroup]="searchForm" (keydown.enter)="search(); $event.preventDefault()" class="space-y-6">
    <div class="grid grid-cols-1 gap-5 md:grid-cols-4">

      <!-- Buscar -->
      <div class="space-y-2 md:col-span-2">
        <label class="text-sm font-medium text-slate-700">Buscar</label>
        <input 
          #buscarInput
          type="text" 
          formControlName="buscar" 
          placeholder="Número del proceso, objeto o entidad..."
          class="w-full rounded-sm border border-slate-300 px-4 py-2.5 text-sm text-slate-700 placeholder:text-slate-400 transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100 focus:outline-none" 
        />
      </div>

      <!-- Estado -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700">Estado del proceso</label>
        <select formControlName="estado"
          class="w-full rounded-sm border border-slate-300 px-4 py-2.5 text-sm text-slate-700 transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100 focus:outline-none">
          <option value="">Seleccione un estado</option>
          @for (estado of estados; track estado) {
          <option [value]="estado">{{ estado }}</option>
          }
        </select>
      </div>

      <!-- Tipo de proceso -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700">Tipo de proceso</label>
        <select formControlName="tipo_proceso"
          class="w-full rounded-sm border border-slate-300 px-4 py-2.5 text-sm text-slate-700 transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100 focus:outline-none">
          <option value="">Seleccione un tipo de proceso</option>
          @for (tipo of tiposProceso; track tipo) {
          <option [value]="tipo">{{ tipo }}</option>
          }
        </select>
      </div>

      <!-- NUEVO: Tipo de Contrato -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700">Tipo de contrato</label>
        <select formControlName="tipo_contrato"
          class="w-full rounded-sm border border-slate-300 px-4 py-2.5 text-sm text-slate-700 transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100 focus:outline-none">
          <option value="">Seleccione un tipo de contrato</option>
          @for (tipo of tiposContrato; track tipo) {
          <option [value]="tipo">{{ tipo }}</option>
          }
        </select>
      </div>

      <!-- Fecha publicación desde -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700">Fecha publicación desde</label>
        <input type="date" formControlName="fecha_publicacion_desde"
          class="w-full rounded-sm border border-slate-300 px-4 py-2.5 text-sm text-slate-700 transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100 focus:outline-none" />
      </div>

      <!-- Fecha publicación hasta -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700">Fecha publicación hasta</label>
        <input type="date" formControlName="fecha_publicacion_hasta"
          class="w-full rounded-sm border border-slate-300 px-4 py-2.5 text-sm text-slate-700 transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100 focus:outline-none" />
      </div>
    </div>

    <hr class="my-6 border-slate-200" />

    <!-- Botones -->
    <div class="flex justify-end gap-3">
      <button type="button" (click)="clear()"
        class="rounded-sm border border-slate-300 bg-white px-8 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100">
        Limpiar
      </button>

      <button type="button" (click)="search()" [disabled]="isLoading" [attr.aria-busy]="isLoading"
        class="rounded-sm bg-blue-600 px-8 py-2.5 text-sm font-medium text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-70">
        @if (isLoading) {
          <span class="inline-flex items-center gap-2">
            <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Zm2 5.291A8 8 0 0 0 20 12h4a12 12 0 0 1-10 11.708v-4.417Z"></path>
            </svg>
            Buscando...
          </span>
        } @else {
          Buscar
        }
      </button>
    </div>
  </div>
</app-card>
