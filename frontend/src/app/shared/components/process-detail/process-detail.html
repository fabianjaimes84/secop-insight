<!-- ==========================================
     Modal de detalle del proceso
     ------------------------------------------
     Este componente se muestra únicamente
     cuando la propiedad "open" es verdadera.
     ========================================== -->

@if (open) {

<!-- ==========================================
     Fondo oscuro (Backdrop)
     ========================================== -->

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-[2px] animate-fade-in"
  (click)="closeModal()">

  <!-- ==========================================
       Contenedor principal del modal
       ========================================== -->

  <div class="flex h-[80vh] w-[80vw] flex-col overflow-hidden rounded-2xl bg-white shadow-2xl animate-scale-in"
    (click)="$event.stopPropagation()">

    <!-- ==========================================
         Encabezado
         ========================================== -->

    <header class="flex items-center justify-between border-b border-slate-200 px-6 py-4">

      <div>

        <h2 class="text-xl font-semibold text-slate-800">
          Detalle del proceso
        </h2>

        <p class="mt-1 text-sm text-slate-500">

          {{ process?.referencia_del_proceso }}

        </p>

      </div>

      <!-- Botón cerrar -->

      <button type="button"
        class="flex h-10 w-10 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-red-600"
        title="Cerrar" (click)="closeModal()">

        <i class="fa-solid fa-xmark text-lg"></i>

      </button>

    </header>

    <!-- ==========================================
         Contenido temporal
         ========================================== -->

    <main class="flex-1 overflow-y-auto p-6">

      <div class="flex h-full items-center justify-center rounded-xl border-2 border-dashed border-slate-200">

        <div class="text-center">

          <i class="fa-regular fa-folder-open text-5xl text-slate-300"></i>

          <h3 class="mt-5 text-lg font-semibold text-slate-700">
            Detalle del proceso
          </h3>

          <p class="mt-2 max-w-md text-sm leading-6 text-slate-500">

            Aquí se mostrará la información general,
            el cronograma, los documentos y las
            observaciones del proceso seleccionado.

          </p>

        </div>

      </div>

    </main>

  </div>

</div>

}
