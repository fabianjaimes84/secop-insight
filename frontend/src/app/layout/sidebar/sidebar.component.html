<!-- Botón Móvil -->
<button 
  (click)="toggleMobileSidebar.emit()"
  class="md:hidden fixed top-4 left-4 z-50 p-2 bg-blue-600 text-white rounded-lg shadow-lg hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
  aria-label="Abrir menú"
>
  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
  </svg>
</button>

<!-- Sidebar Principal -->
<aside 
  class="fixed md:static top-0 left-0 h-full w-64 bg-slate-900 text-white transform transition-transform duration-300 ease-in-out z-40 shadow-xl md:shadow-none flex flex-col"
  [class.-translate-x-full]="!isOpen && !isDesktop"
  [class.translate-x-0]="isOpen || isDesktop"
>
  <!-- Logo -->
  <div class="flex justify-center pt-6 pb-2">
    <img alt="SECOP II | Insight" class="w-56 h-auto" src="logo-si.png" />
  </div>

  <!-- Header -->
  <div class="border-b border-blue-700 px-4 pb-4 text-center">
    <h1 class="text-xl font-bold">
      SECOP II
      <span class="text-red-600"> | </span>
      <span class="text-blue-300">Insight</span>
    </h1>
    <p class="mt-1 text-xs text-blue-200 leading-tight">Plataforma Inteligente para la Contratación Pública</p>
  </div>

  <!-- Navegación (Solo menús principales) -->
  <nav class="mt-4 px-3 flex-1 overflow-y-auto">
    <ul class="space-y-1">
      <li *ngFor="let item of menuItems">
        <a 
          [routerLink]="item.route" 
          routerLinkActive="bg-blue-600 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 group focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-inset hover:bg-slate-800 text-slate-300"
        >
          <span class="w-5 flex items-center justify-center text-base flex-shrink-0" [innerHTML]="item.icon"></span>
          <span class="font-medium text-sm">{{ item.label }}</span>
          
          <!-- Indicador activo (visible solo cuando routerLinkActive aplica las clases) -->
          <div class="ml-auto w-1.5 h-1.5 rounded-full bg-white shadow-[0_0_8px_rgba(255,255,255,0.6)] opacity-0 group-[.bg-blue-600]:opacity-100"></div>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sección Separada: Centro de Ayuda (Fuera del Nav) -->
  <div class="px-3 py-2 mt-2">
    <a 
      routerLink="/ayuda"
      class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 text-slate-300 hover:bg-blue-800 hover:text-white group"
    >
      <i class="fa-solid fa-circle-question w-5 text-center text-base flex-shrink-0"></i>
      <span class="font-medium text-sm">Centro de ayuda</span>
    </a>
  </div>

  <!-- Footer de Estado -->
  <div class="p-4 border-t border-blue-800 bg-slate-900/50">
    <div class="flex items-center justify-between mb-2">
      <p class="text-xs text-slate-500">Versión 1.0.0</p>
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
        <p class="text-xs text-blue-400 font-medium">API V3</p>
      </div>
    </div>
  </div>
</aside>

<!-- Overlay para móvil -->
<div 
  *ngIf="isOpen && !isDesktop" 
  (click)="toggleMobileSidebar.emit()"
  class="fixed inset-0 bg-black/50 z-30 backdrop-blur-sm md:hidden transition-opacity"
></div>
