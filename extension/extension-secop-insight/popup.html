<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      color: #1e293b;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 15px;
    }
    p {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #64748b;
    }
    ol {
      margin: 0;
      padding-left: 18px;
      font-size: 12px;
      line-height: 1.7;
      color: #475569;
    }
    .nota {
      margin-top: 12px;
      padding: 8px 10px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <h1>SECOP II Insight</h1>
  <p>Captura automática de procesos.</p>

  <ol>
    <li>Abre un proceso en SECOP.</li>
    <li>Pasa el reCAPTCHA como siempre.</li>
    <li>El proceso se guarda solo.</li>
  </ol>

  <div class="nota">
    No se descarga ningún archivo. Requiere que el servidor de
    SECOP Insight esté corriendo en localhost:8000.
  </div>
</body>
</html>
